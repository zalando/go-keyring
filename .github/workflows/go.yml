name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build-linux:
    name: Build (ubuntu-latest)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:latest
      options: --privileged
      env:
        DEBIAN_FRONTEND: noninteractive

    permissions:
      contents: read

    steps:
    - name: Check out code into $GITHUB_WORKSPACE directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: ^1.22
      id: go

    - name: Install Dependencies
      run: |
        apt-get update
        apt-get install -y gnome-keyring build-essential ca-certificates
        mkdir -p /github/home/.cache/
        mkdir -p /github/home/.local/share/keyrings/
        chmod 700 -R /github/home/.local/

    - name: Get dependencies
      run: |
        go get -v -t -d ./...

    - name: Build
      run: |
        go build -v ./...

    - name: Test
      run: |
        echo 'somecredstorepass' | gnome-keyring-daemon --unlock
        go test -v ./...
      shell: dbus-run-session -- bash --noprofile --norc -eo pipefail {0}

  build-wsl:
    name: Build (WSL)
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
    - name: Check out code into $GITHUB_WORKSPACE directory
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

    - name: Set up WSL
      uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7
      with:
        distribution: Ubuntu-24.04
        additional-packages: ca-certificates curl

    - name: Install Go
      shell: wsl-bash {0}
      run: |
        GO_VERSION=$(curl -fsSL "https://go.dev/VERSION?m=text" | head -n1)
        echo "Installing ${GO_VERSION}"
        curl -fsSL "https://go.dev/dl/${GO_VERSION}.linux-amd64.tar.gz" -o /tmp/go.tar.gz
        rm -rf /usr/local/go
        tar -C /usr/local -xzf /tmp/go.tar.gz

    - name: Get dependencies
      shell: wsl-bash {0}
      run: |
        export PATH=$PATH:/usr/local/go/bin
        go get -v -t -d ./...

    - name: Build
      shell: wsl-bash {0}
      run: |
        export PATH=$PATH:/usr/local/go/bin
        go build -v ./...

    - name: Test
      shell: wsl-bash {0}
      run: |
        export PATH=$PATH:/usr/local/go/bin
        # Sanity check that we are actually running under WSL with Windows
        # interop enabled, so the tests exercise the Windows Credential Manager
        # backend rather than the secret-service fallback.
        powershell.exe -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
        go test -v ./...

  build-other:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macOS-latest, windows-latest]

    permissions:
      contents: read

    steps:
    - name: Check out code into $GITHUB_WORKSPACE directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: ^1.22
      id: go

    - name: Get dependencies
      run: |
        go get -v -t -d ./...

    - name: Build
      run: |
        go build -v ./...

    - name: Test
      run: |
        go test -v ./...

  build-freebsd:
    name: Build (FreeBSD)
    # runs-on: macos-12
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Test in FreeBSD
      id: test
      uses: vmactions/freebsd-vm@v1
      with:
        usesh: true
        prepare: pkg install -y go gnome-keyring
        run: |
          go version
          go build -v
          dbus-run-session -- sh -c "echo 'somecredstorepass' | gnome-keyring-daemon --unlock; go test -v ./..."
          # verify that we can build for freebsd with cgo disabled
          # This will disable the functionality as it depends on cgo (via
          # godbus) but should still be buildable to not break backwards
          # compatibility
          CGO_ENABLED=0 go build -v
